apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: nm
  namespace: default
spec:
  backendFramework: vllm
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.0
          imagePullPolicy: IfNotPresent
          command:
          - python3
          - -m
          - dynamo.frontend
          args:
          - --http-port
          - '8000'
  - name: m1
    type: worker
    replicas: 1
    podTemplate:
      metadata:
        labels:
          kai.scheduler/queue: default-queue
        annotations:
          nvidia.com/container.main.gpu-compute.request: '0.05'
          nvidia.com/container.main.gpu-memory.request: 4500Mi
          nvidia.com/container.main.gpu-memory.limit: 4500Mi
          nvidia.com/container.main.gpu-compute.mode: sm-sharing
      spec:
        schedulerName: kai-scheduler
        runtimeClassName: nvidia
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.0
          imagePullPolicy: IfNotPresent
          command:
          - python3
          - -m
          - dynamo.vllm
          args:
          - --model
          - Qwen/Qwen3-0.6B
          - --gpu-memory-utilization
          - '0.80'
          - --max-model-len
          - '8192'
          - --served-model-name
          - m1
          env:
          - name: HF_HOME
            value: /opt/hf-cache
          - name: HF_HUB_OFFLINE
            value: '1'
          volumeMounts:
          - name: hf
            mountPath: /opt/hf-cache
          - name: shm
            mountPath: /dev/shm
        volumes:
        - name: hf
          hostPath:
            path: /opt/hf-cache
            type: Directory
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
  - name: m2
    type: worker
    replicas: 1
    podTemplate:
      metadata:
        labels:
          kai.scheduler/queue: default-queue
        annotations:
          nvidia.com/container.main.gpu-compute.request: '0.05'
          nvidia.com/container.main.gpu-memory.request: 4500Mi
          nvidia.com/container.main.gpu-memory.limit: 4500Mi
          nvidia.com/container.main.gpu-compute.mode: sm-sharing
      spec:
        schedulerName: kai-scheduler
        runtimeClassName: nvidia
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.0
          imagePullPolicy: IfNotPresent
          command:
          - python3
          - -m
          - dynamo.vllm
          args:
          - --model
          - Qwen/Qwen3-0.6B
          - --gpu-memory-utilization
          - '0.80'
          - --max-model-len
          - '8192'
          - --served-model-name
          - m2
          env:
          - name: HF_HOME
            value: /opt/hf-cache
          - name: HF_HUB_OFFLINE
            value: '1'
          volumeMounts:
          - name: hf
            mountPath: /opt/hf-cache
          - name: shm
            mountPath: /dev/shm
        volumes:
        - name: hf
          hostPath:
            path: /opt/hf-cache
            type: Directory
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
