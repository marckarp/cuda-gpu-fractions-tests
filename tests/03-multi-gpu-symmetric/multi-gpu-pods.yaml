# Two pods, each asking for half of BOTH GPUs on a 2x A100 node.
# gpu-fraction-num-devices: "2" applies the same fraction to two GPUs.
apiVersion: v1
kind: Pod
metadata:
  name: multi-a
  labels: {kai.scheduler/queue: default-queue}
  annotations:
    gpu-fraction: "0.5"
    gpu-fraction-num-devices: "2"
    nvidia.com/container.main.gpu-compute.mode: sm-sharing
spec:
  schedulerName: kai-scheduler
  runtimeClassName: nvidia
  restartPolicy: Never
  securityContext: {runAsNonRoot: true, runAsUser: 1000}
  containers:
  - name: main
    image: nvcr.io/nvidia/k8s/cuda-sample:devicequery
    command: ["sh","-c","sleep 600"]
    securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
---
apiVersion: v1
kind: Pod
metadata:
  name: multi-b
  labels: {kai.scheduler/queue: default-queue}
  annotations:
    gpu-fraction: "0.5"
    gpu-fraction-num-devices: "2"
    nvidia.com/container.main.gpu-compute.mode: sm-sharing
spec:
  schedulerName: kai-scheduler
  runtimeClassName: nvidia
  restartPolicy: Never
  securityContext: {runAsNonRoot: true, runAsUser: 1000}
  containers:
  - name: main
    image: nvcr.io/nvidia/k8s/cuda-sample:devicequery
    command: ["sh","-c","sleep 600"]
    securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
