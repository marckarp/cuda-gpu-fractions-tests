# 07-B13: noexp + UCX debug logging to files on both workers
# Operator-less: frontend + 2 workers as plain pods, file discovery over a hostPath,
# TCP request plane, ZMQ events (1.5 defaults). No etcd, no NATS.
#
# prefill: 60% SMs, 14000 MiB   decode: 40% SMs, 25000 MiB
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend
  labels: { app: dyn-frac, role: frontend }
spec:
  hostNetwork: true            # curl localhost:8000 from the box
  restartPolicy: Never
  containers:
    - name: main
      image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.0
      imagePullPolicy: IfNotPresent
      command: ["python3", "-m", "dynamo.frontend"]
      args: ["--http-port", "8000", "--router-mode", "round-robin"]
      env:
        - { name: DYN_DISCOVERY_BACKEND, value: file }
        - { name: DYN_FILE_KV, value: /opt/dyn-discovery }
        - { name: DYN_LOG, value: info }
      volumeMounts:
        - { name: discovery, mountPath: /opt/dyn-discovery }
  volumes:
    - name: discovery
      hostPath: { path: /opt/dyn-discovery, type: Directory }
---
apiVersion: v1
kind: Pod
metadata:
  name: prefill
  labels: { app: dyn-frac, role: prefill, kai.scheduler/queue: default-queue }
  annotations:
    nvidia.com/container.main.gpu-compute.request: "0.6"
    nvidia.com/container.main.gpu-memory.request: 14000Mi
    nvidia.com/container.main.gpu-memory.limit: 14000Mi
    nvidia.com/container.main.gpu-compute.mode: sm-sharing
spec:
  schedulerName: kai-scheduler
  runtimeClassName: nvidia
  restartPolicy: Never
  securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }
  containers:
    - name: main
      image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.0
      imagePullPolicy: IfNotPresent
      command: ["python3", "-m", "dynamo.vllm"]
      args:
        - --model
        - Qwen/Qwen3-4B
        - --disaggregation-mode
        - prefill
        - --kv-transfer-config
        - '{"kv_connector":"NixlConnector","kv_role":"kv_producer"}'
        - --gpu-memory-utilization
        - "0.85"                 # of the 14000 MiB cap
        - --max-model-len
        - "8192"
        - --enforce-eager
      env:
        - { name: DYN_DISCOVERY_BACKEND, value: file }
        - { name: DYN_FILE_KV, value: /opt/dyn-discovery }
        - { name: DYN_SYSTEM_PORT, value: "8082" }
        - { name: HF_HOME, value: /opt/hf-cache }
        - { name: VLLM_NIXL_SIDE_CHANNEL_PORT, value: "20097" }
        - name: VLLM_NIXL_SIDE_CHANNEL_HOST
          valueFrom: { fieldRef: { fieldPath: status.podIP } }
        - { name: DYN_LOG, value: info }
        - { name: UCX_RCACHE_MAX_UNRELEASED, value: "1024" }   # NIXL asks for this; without it UCX rcache thrashes per descriptor
        - { name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:False" }   # keep KV cache on cudaMalloc memory so UCX cuda_ipc can export it
        - { name: UCX_LOG_LEVEL, value: debug }
        - { name: UCX_LOG_FILE, value: /tmp/ucx-%h-%p.log }   # debug log to files, grep for cuda_ipc registration errors
      volumeMounts:
        - { name: discovery, mountPath: /opt/dyn-discovery }
        - { name: hf, mountPath: /opt/hf-cache }
        - { name: shm, mountPath: /dev/shm }
        - { name: vllm-patch, mountPath: /usr/local/lib/python3.12/dist-packages/vllm/v1/core/block_pool.py, subPath: block_pool.py, readOnly: true }   # PoC: contiguous block allocation
  volumes:
    - name: discovery
      hostPath: { path: /opt/dyn-discovery, type: Directory }
    - name: hf
      hostPath: { path: /opt/hf-cache, type: Directory }
    - name: shm
      emptyDir: { medium: Memory, sizeLimit: 8Gi }
    - name: vllm-patch
      hostPath: { path: /opt/vllm-patch, type: Directory }
---
apiVersion: v1
kind: Pod
metadata:
  name: decode
  labels: { app: dyn-frac, role: decode, kai.scheduler/queue: default-queue }
  annotations:
    nvidia.com/container.main.gpu-compute.request: "0.4"
    nvidia.com/container.main.gpu-memory.request: 25000Mi
    nvidia.com/container.main.gpu-memory.limit: 25000Mi
    nvidia.com/container.main.gpu-compute.mode: sm-sharing
spec:
  schedulerName: kai-scheduler
  runtimeClassName: nvidia
  restartPolicy: Never
  securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }
  containers:
    - name: main
      image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.0
      imagePullPolicy: IfNotPresent
      command: ["python3", "-m", "dynamo.vllm"]
      args:
        - --model
        - Qwen/Qwen3-4B
        - --disaggregation-mode
        - decode
        - --kv-transfer-config
        - '{"kv_connector":"NixlConnector","kv_role":"kv_consumer"}'
        - --gpu-memory-utilization
        - "0.88"                 # of the 25000 MiB cap
        - --max-model-len
        - "8192"
        - --enforce-eager
      env:
        - { name: DYN_DISCOVERY_BACKEND, value: file }
        - { name: DYN_FILE_KV, value: /opt/dyn-discovery }
        - { name: DYN_SYSTEM_PORT, value: "8081" }
        - { name: HF_HOME, value: /opt/hf-cache }
        - { name: VLLM_NIXL_SIDE_CHANNEL_PORT, value: "20098" }
        - name: VLLM_NIXL_SIDE_CHANNEL_HOST
          valueFrom: { fieldRef: { fieldPath: status.podIP } }
        - { name: DYN_LOG, value: info }
        - { name: UCX_RCACHE_MAX_UNRELEASED, value: "1024" }   # NIXL asks for this; without it UCX rcache thrashes per descriptor
        - { name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:False" }   # keep KV cache on cudaMalloc memory so UCX cuda_ipc can export it
        - { name: UCX_LOG_LEVEL, value: debug }
        - { name: UCX_LOG_FILE, value: /tmp/ucx-%h-%p.log }   # debug log to files, grep for cuda_ipc registration errors
      volumeMounts:
        - { name: discovery, mountPath: /opt/dyn-discovery }
        - { name: hf, mountPath: /opt/hf-cache }
        - { name: shm, mountPath: /dev/shm }
        - { name: vllm-patch, mountPath: /usr/local/lib/python3.12/dist-packages/vllm/v1/core/block_pool.py, subPath: block_pool.py, readOnly: true }   # PoC: contiguous block allocation
        - { name: vllm-patch, mountPath: /usr/local/lib/python3.12/dist-packages/vllm/distributed/kv_transfer/kv_connector/v1/nixl/pull_worker.py, subPath: pull_worker.py, readOnly: true }   # [XFERDBG] instrumentation
        - { name: vllm-patch, mountPath: /usr/local/lib/python3.12/dist-packages/vllm/distributed/kv_transfer/kv_connector/v1/nixl/base_worker.py, subPath: base_worker.py, readOnly: true }
  volumes:
    - name: discovery
      hostPath: { path: /opt/dyn-discovery, type: Directory }
    - name: hf
      hostPath: { path: /opt/hf-cache, type: Directory }
    - name: shm
      emptyDir: { medium: Memory, sizeLimit: 8Gi }
    - name: vllm-patch
      hostPath: { path: /opt/vllm-patch, type: Directory }
