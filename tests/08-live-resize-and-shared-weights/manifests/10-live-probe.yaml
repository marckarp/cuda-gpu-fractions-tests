# Test 08 A/B: one fraction pod (30% SMs, 10000 MiB) running scripts/live_probe.py.
# The limits are then changed from the host with `nvidia-cuda-mps-control namespace set`.
apiVersion: v1
kind: Pod
metadata:
  name: live-probe
  labels: { app: t08, kai.scheduler/queue: default-queue }
  annotations:
    nvidia.com/container.main.gpu-compute.request: "0.3"
    nvidia.com/container.main.gpu-memory.request: 10000Mi
    nvidia.com/container.main.gpu-memory.limit: 10000Mi
    nvidia.com/container.main.gpu-compute.mode: sm-sharing
spec:
  schedulerName: kai-scheduler
  runtimeClassName: nvidia
  restartPolicy: Never
  securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }
  containers:
    - name: main
      image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.0
      imagePullPolicy: IfNotPresent
      command: ["python3", "-u", "/opt/t08/live_probe.py"]
      env:
        - { name: PROBE_MIB, value: "12000" }   # above the 10000 MiB cap: fails until the cap is raised
      volumeMounts:
        - { name: t08, mountPath: /opt/t08 }
  volumes:
    - name: t08
      hostPath: { path: /opt/t08, type: Directory }
