# Test 08 C: the PoC layout (../../poc-small-model-disagg-on-one-gpu/manifests/20-frac-disagg-1gpu.yaml)
# plus a GMS pod that owns ONE copy of the weights. Prefill and decode load with
# --load-format gms: the first engine up loads from disk into GMS, the second maps it.
#
# gms: 5% SMs, 10000 MiB   prefill: 60% SMs, 14000 MiB   decode: 35% SMs, 25000 MiB
# Changes against the PoC manifest are marked "# t08".
---
apiVersion: v1
kind: Pod
metadata:
  name: gms
  labels: { app: dyn-frac, role: gms, kai.scheduler/queue: default-queue }
  annotations:
    nvidia.com/container.main.gpu-compute.request: "0.05"
    nvidia.com/container.main.gpu-memory.request: 10000Mi
    nvidia.com/container.main.gpu-memory.limit: 10000Mi
    nvidia.com/container.main.gpu-compute.mode: sm-sharing
spec:
  schedulerName: kai-scheduler
  runtimeClassName: nvidia
  restartPolicy: Never
  securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }
  containers:
    - name: main
      image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.0
      imagePullPolicy: IfNotPresent
      command: ["python3", "-m", "gpu_memory_service"]
      args: ["--device", "0", "--tag", "weights", "--verbose"]
      env:
        - { name: GMS_SOCKET_DIR, value: /opt/gms }
      volumeMounts:
        - { name: gms, mountPath: /opt/gms }
  volumes:
    - name: gms
      hostPath: { path: /opt/gms, type: Directory }
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend
  labels: { app: dyn-frac, role: frontend }
spec:
  hostNetwork: true
  restartPolicy: Never
  containers:
    - name: main
      image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.0
      imagePullPolicy: IfNotPresent
      command: ["python3", "-m", "dynamo.frontend"]
      args: ["--http-port", "8000", "--router-mode", "round-robin"]
      env:
        - { name: DYN_DISCOVERY_BACKEND, value: file }
        - { name: DYN_FILE_KV, value: /opt/dyn-discovery }
        - { name: DYN_LOG, value: info }
      volumeMounts:
        - { name: discovery, mountPath: /opt/dyn-discovery }
  volumes:
    - name: discovery
      hostPath: { path: /opt/dyn-discovery, type: Directory }
---
apiVersion: v1
kind: Pod
metadata:
  name: prefill
  labels: { app: dyn-frac, role: prefill, kai.scheduler/queue: default-queue }
  annotations:
    nvidia.com/container.main.gpu-compute.request: "0.6"
    nvidia.com/container.main.gpu-memory.request: 14000Mi
    nvidia.com/container.main.gpu-memory.limit: 14000Mi
    nvidia.com/container.main.gpu-compute.mode: sm-sharing
spec:
  schedulerName: kai-scheduler
  runtimeClassName: nvidia
  restartPolicy: Never
  securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }
  containers:
    - name: main
      image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.0
      imagePullPolicy: IfNotPresent
      command: ["python3", "-m", "dynamo.vllm"]
      args:
        - --model
        - Qwen/Qwen3-4B
        - --disaggregation-mode
        - prefill
        - --kv-transfer-config
        - '{"kv_connector":"NixlConnector","kv_role":"kv_producer"}'
        - --gpu-memory-utilization
        - "0.29"               # t08: 0.80 in the PoC. The 7.56 GiB mapped weights count against this pod's cap but not in CUDA's free memory, so vLLM must be told to leave room
        - --max-model-len
        - "8192"
        - --enforce-eager
        - --load-format        # t08
        - gms                  # t08
      env:
        - { name: DYN_DISCOVERY_BACKEND, value: file }
        - { name: DYN_FILE_KV, value: /opt/dyn-discovery }
        - { name: DYN_SYSTEM_PORT, value: "8082" }
        - { name: HF_HOME, value: /opt/hf-cache }
        - { name: VLLM_NIXL_SIDE_CHANNEL_PORT, value: "20097" }
        - name: VLLM_NIXL_SIDE_CHANNEL_HOST
          valueFrom: { fieldRef: { fieldPath: status.podIP } }
        - { name: DYN_LOG, value: info }
        - { name: UCX_RCACHE_MAX_UNRELEASED, value: "1024" }
        - { name: GMS_SOCKET_DIR, value: /opt/gms }   # t08
      volumeMounts:
        - { name: discovery, mountPath: /opt/dyn-discovery }
        - { name: hf, mountPath: /opt/hf-cache }
        - { name: shm, mountPath: /dev/shm }
        - { name: gms, mountPath: /opt/gms }          # t08
  volumes:
    - name: discovery
      hostPath: { path: /opt/dyn-discovery, type: Directory }
    - name: hf
      hostPath: { path: /opt/hf-cache, type: Directory }
    - name: shm
      emptyDir: { medium: Memory, sizeLimit: 8Gi }
    - name: gms
      hostPath: { path: /opt/gms, type: Directory }
---
apiVersion: v1
kind: Pod
metadata:
  name: decode
  labels: { app: dyn-frac, role: decode, kai.scheduler/queue: default-queue }
  annotations:
    nvidia.com/container.main.gpu-compute.request: "0.35"   # t08: 0.4 in the PoC; 0.05 goes to the gms pod
    nvidia.com/container.main.gpu-memory.request: 25000Mi
    nvidia.com/container.main.gpu-memory.limit: 25000Mi
    nvidia.com/container.main.gpu-compute.mode: sm-sharing
spec:
  schedulerName: kai-scheduler
  runtimeClassName: nvidia
  restartPolicy: Never
  securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }
  containers:
    - name: main
      image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.0
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "for i in $(seq 200); do /bin/true; done; exec python3 -m dynamo.vllm \"$@\"", "--"]
      args:
        - --model
        - Qwen/Qwen3-4B
        - --disaggregation-mode
        - decode
        - --kv-transfer-config
        - '{"kv_connector":"NixlConnector","kv_role":"kv_consumer"}'
        - --gpu-memory-utilization
        - "0.45"               # t08: 0.75 in the PoC, same reason as prefill
        - --max-model-len
        - "8192"
        - --enforce-eager
        - --load-format        # t08
        - gms                  # t08
      env:
        - { name: DYN_DISCOVERY_BACKEND, value: file }
        - { name: DYN_FILE_KV, value: /opt/dyn-discovery }
        - { name: DYN_SYSTEM_PORT, value: "8081" }
        - { name: HF_HOME, value: /opt/hf-cache }
        - { name: VLLM_NIXL_SIDE_CHANNEL_PORT, value: "20098" }
        - name: VLLM_NIXL_SIDE_CHANNEL_HOST
          valueFrom: { fieldRef: { fieldPath: status.podIP } }
        - { name: DYN_LOG, value: info }
        - { name: UCX_RCACHE_MAX_UNRELEASED, value: "1024" }
        - { name: GMS_SOCKET_DIR, value: /opt/gms }   # t08
      volumeMounts:
        - { name: discovery, mountPath: /opt/dyn-discovery }
        - { name: hf, mountPath: /opt/hf-cache }
        - { name: shm, mountPath: /dev/shm }
        - { name: gms, mountPath: /opt/gms }          # t08
  volumes:
    - name: discovery
      hostPath: { path: /opt/dyn-discovery, type: Directory }
    - name: hf
      hostPath: { path: /opt/hf-cache, type: Directory }
    - name: shm
      emptyDir: { medium: Memory, sizeLimit: 8Gi }
    - name: gms
      hostPath: { path: /opt/gms, type: Directory }
