apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: mm-d
  namespace: default
spec:
  backendFramework: vllm
  components:
  - name: qwen06b
    type: worker
    replicas: 1
    podTemplate:
      metadata:
        labels:
          kai.scheduler/queue: default-queue
        annotations:
          nvidia.com/container.main.gpu-compute.request: '0.1'
          nvidia.com/container.main.gpu-memory.request: 6000Mi
          nvidia.com/container.main.gpu-memory.limit: 6000Mi
          nvidia.com/container.main.gpu-compute.mode: sm-sharing
      spec:
        schedulerName: kai-scheduler
        runtimeClassName: nvidia
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.0
          imagePullPolicy: IfNotPresent
          command:
          - python3
          - -m
          - dynamo.vllm
          args:
          - --model
          - Qwen/Qwen3-0.6B
          - --gpu-memory-utilization
          - '0.80'
          - --max-model-len
          - '8192'
          env:
          - name: HF_HOME
            value: /opt/hf-cache
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: DYN_NAMESPACE
            value: default-mm-c1-qwen06b
          volumeMounts:
          - name: hf
            mountPath: /opt/hf-cache
          - name: shm
            mountPath: /dev/shm
        volumes:
        - name: hf
          hostPath:
            path: /opt/hf-cache
            type: Directory
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi

